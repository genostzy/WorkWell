name: CI

# Every push to a branch and every pull request into main. The app lives in a
# subdirectory of this repo, so every step below runs from there rather than
# from the repo root.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  # A second push to the same branch makes the first run's answer worthless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workwell-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workwell-app/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Last, because it is the slowest and the three above localise a failure
      # far better than a build log does. The Supabase keys are public
      # (publishable, RLS-guarded) but still come from repo secrets rather than
      # being pinned here, so a project move does not need a code change.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
